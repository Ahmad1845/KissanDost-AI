name: KissanDost AI - Backend & Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  fastapi-backend-tests:
    name: Python 3.12 FastAPI & AI Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI Test Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic pydantic-settings numpy scikit-learn pytest pytest-asyncio
      - name: Run AI Pipeline & Decision Engine Unit Tests
        working-directory: ./backend
        run: pytest tests/ -v

  typescript-gateway-build:
    name: TypeScript API Gateway & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck & Build
        run: |
          npm run lint
          npm run build
